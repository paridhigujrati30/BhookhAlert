<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - BhookhAlert</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/staff.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="../../index.html">BhookhAlert</a>
            </div>
            <div class="nav-links">
                <a href="../../restaurant-selection/selectRestaurant.html" class="nav-link">Restaurants</a>
                <a href="../../customer-dashboard/status.html" class="nav-link">Queue</a>
                <a href="#" class="nav-link" onclick="alert('Profile coming soon!'); return false;">Profile</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <header class="hero-section">
            <!-- ADD YOUR HERO BACKGROUND IMAGE in staff.css .hero-section -->
            <h1>Analytics Dashboard</h1>
            <p class="subtitle">Restaurant performance insights</p>
        </header>

        <nav class="dashboard-nav">
            <a href="staff.html" class="nav-link">Queue Management</a>
            <a href="analytics.html" class="nav-link active">Analytics</a>
        </nav>

        <div class="analytics-grid">
            <div class="analytics-card">
                <h2>Peak Hours</h2>
                <div id="peakHoursChart" class="chart-container">
                    <!-- Peak hours chart will be displayed here -->
                </div>
            </div>

            <div class="analytics-card">
                <h2>Average Wait Time</h2>
                <div class="metric-display">
                    <div class="metric-value" id="avgWaitTimeMetric">0 min</div>
                    <div class="metric-label">Today's Average</div>
                </div>
                <div class="metric-trend">
                    <span id="waitTimeTrend" class="trend-indicator">→</span>
                    <span id="waitTimeChange">No change</span>
                </div>
            </div>

            <div class="analytics-card">
                <h2>Customers Served</h2>
                <div class="metric-display">
                    <div class="metric-value" id="customersServedMetric">0</div>
                    <div class="metric-label">Per Hour</div>
                </div>
                <div class="hourly-breakdown" id="hourlyBreakdown">
                    <!-- Hourly breakdown will be displayed here -->
                </div>
            </div>

            <div class="analytics-card">
                <h2>Queue Length Trends</h2>
                <div id="queueTrendChart" class="chart-container">
                    <!-- Queue trend chart will be displayed here -->
                </div>
            </div>

            <div class="analytics-card">
                <h2>VIP vs Regular</h2>
                <div id="customerTypeChart" class="chart-container">
                    <!-- Customer type chart will be displayed here -->
                </div>
            </div>

            <div class="analytics-card">
                <h2>No-Show Rate</h2>
                <div class="metric-display">
                    <div class="metric-value" id="noShowRateMetric">0%</div>
                    <div class="metric-label">Today's Rate</div>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button onclick="window.location.href='staff.html'" class="btn-primary">Back to Queue Management</button>
            <button id="refreshAnalytics" class="btn-secondary">Refresh Analytics</button>
        </div>
    </div>

    <script src="../customer-dashboard/js/joinQueue.js"></script>
    <script src="../customer-dashboard/js/socket.js"></script>
    <script src="js/analytics.js"></script>
</body>
</html>
