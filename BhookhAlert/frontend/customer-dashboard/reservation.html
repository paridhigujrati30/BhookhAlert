<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation Check-in - BhookhAlert</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/customer.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="../../index.html">BhookhAlert</a>
            </div>
            <div class="nav-links">
                <a href="../../restaurant-selection/selectRestaurant.html" class="nav-link">Restaurants</a>
                <a href="status.html" class="nav-link">Queue</a>
                <a href="#" class="nav-link" onclick="alert('Profile coming soon!'); return false;">Profile</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <section class="hero-section">
            <h1>Reservation Check-in</h1>
            <p class="subtitle">Check in for your reservation</p>
        </section>

        <section class="form-section">
            <div class="content-card">
                <form id="reservationCheckinForm" class="queue-form">
                    <div class="form-group">
                        <label for="reservationPhone">Phone Number</label>
                        <input type="tel" id="reservationPhone" name="reservationPhone" placeholder="Enter phone number used for reservation" required>
                        <small class="form-hint">Enter the phone number you used when making the reservation</small>
                    </div>

                    <button type="submit" class="btn-primary">Check In</button>
                </form>

                <div id="checkinResult" class="checkin-result">
                    <!-- Check-in result will be displayed here -->
                </div>
            </div>
        </section>
    </div>

    <script src="js/joinQueue.js"></script>
    <script src="js/reservationCheckin.js"></script>
</body>
</html>
