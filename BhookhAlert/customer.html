<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Queue - BhookhAlert</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="customer.css">

</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="../../index.html">BhookhAlert</a>
            </div>
            <div class="nav-links">
                <a href="selectRestaurant.html" class="nav-link">Restaurants</a>
                <a href="status.html" class="nav-link">Queue</a>
                <a href="#" class="nav-link" onclick="alert('Profile coming soon!'); return false;">Profile</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <section class="hero-section">
            <h1>Join the Queue</h1>
            <p class="subtitle">Get in line for your table</p>
        </section>

        <section class="form-section">
            <div class="content-card">
                <form id="joinQueueForm" class="queue-form">
                    <div class="form-group">
                        <label for="customerName">Your Name</label>
                        <input type="text" id="customerName" name="customerName" placeholder="Enter your name" required>
                    </div>

                    <div class="form-group">
                        <label for="partySize">Party Size</label>
                        <select id="partySize" name="partySize" required>
                            <option value="">Select party size</option>
                            <option value="1">1 person</option>
                            <option value="2">2 people</option>
                            <option value="3">3 people</option>
                            <option value="4">4 people</option>
                            <option value="5">5 people</option>
                            <option value="6">6 people</option>
                            <option value="7">7 people</option>
                            <option value="8">8+ people</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="phoneNumber">Phone Number</label>
                        <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="Enter your phone number" required>
                    </div>

                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="isVIP" name="isVIP">
                            <span class="checkmark"></span>
                            VIP Priority (Faster seating)
                        </label>
                    </div>

                    <button type="submit" class="btn-primary">Join Queue</button>
                </form>
            </div>
        </section>
    </div>

    <div id="notifications"></div>

    <script src="js/joinQueue.js"></script>
</body>
</html>
